<body bgColor="#cfcfcf">
<Div class="GHeader">List of Plug-ins</Div>
<hr>
<p>
<Div class="GBodyTextBold"> The following list is generated from the navigator.plugins 
  object. The information can now be used to make sure that the clients browser 
  is able to run the information on the page. Internet explorer does not run this 
  script. </Div>

<hr>
<table BORDER>
<tr><th>Plug-in Name</th>
    <th>Filename</th>
    <th>Description</th>
</tr>
<script LANGUAGE="Javascript">
for (i=0; i<navigator.plugins.length; i++) {
document.write("<tr><td>");
document.write(navigator.plugins[i].name);
document.write("</td><td>");
document.write(navigator.plugins[i].filename);
document.write("</td><td>");
document.write(navigator.plugins[i].description);
document.write("</td></tr>");
}
</script>
</table>
</body>
</html>
