<script>
function fitDoor() {
  var door = document.getElementById("door");
  var lang = document.getElementById("Layer2");
  var anim = document.getElementById("Layer1");
  if (!lang || !anim) return;
  if (door) door.style.transform = "none";
  var langW = lang.offsetWidth;
  var langH = lang.offsetHeight;
  var animW = anim.offsetWidth;
  var animH = anim.offsetHeight;
  if (!langW || !langH || !animW || !animH) return;
  var edge = 8;
  var maxH = window.innerHeight - edge * 2;
  if (maxH < 80) maxH = window.innerHeight;
  var langScale = maxH / langH;
  var colRight = edge + langW * langScale;
  var space = window.innerWidth - colRight;
  var animScale = maxH / animH;
  var animWidth = animW * animScale;
  var minGap = 8;
  if (animWidth > space - minGap * 2) {
    animWidth = Math.max(40, space - minGap * 2);
    animScale = animWidth / animW;
  }
  var animHeight = animH * animScale;
  var gap = (space - animWidth) / 2;
  lang.style.left = edge + "px";
  lang.style.top = edge + "px";
  lang.style.transform = "scale(" + langScale + ")";
  anim.style.left = (colRight + gap) + "px";
  anim.style.top = ((window.innerHeight - animHeight) / 2) + "px";
  anim.style.transform = "scale(" + animScale + ")";
}
function stopDoorAudio() {
  var el = document.getElementById("intro-audio");
  if (!el) return;
  el.pause();
  try { el.currentTime = 0; } catch (err) {}
}
function leaveDoor() {
  stopDoorAudio();
  return true;
}
window.addEventListener("resize", fitDoor);
window.addEventListener("load", fitDoor);
window.addEventListener("pagehide", stopDoorAudio);
fitDoor();
window.addEventListener("click", function playIntro(event) {
  var target = event.target;
  if (target && target.closest && target.closest("a")) return;
  var el = document.getElementById("intro-audio");
  if (el) el.play();
  window.removeEventListener("click", playIntro);
}, true);
</script>
