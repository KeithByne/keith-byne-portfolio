<script>
function fitDoor() {
  var door = document.getElementById("door");
  if (!door) return;
  var scale = window.innerWidth / 790;
  door.style.transform = "scale(" + scale + ")";
  door.style.left = "0px";
  door.style.top = "0px";
}
function stopDoorAudio() {
  var el = document.getElementById("intro-audio");
  if (!el) return;
  el.pause();
  try { el.currentTime = 0; } catch (err) {}
}
function leaveDoor() {
  stopDoorAudio();
  return true;
}
window.addEventListener("resize", fitDoor);
window.addEventListener("load", fitDoor);
window.addEventListener("pagehide", stopDoorAudio);
fitDoor();
window.addEventListener("click", function playIntro(event) {
  var target = event.target;
  if (target && target.closest && target.closest("a")) return;
  var el = document.getElementById("intro-audio");
  if (el) el.play();
  window.removeEventListener("click", playIntro);
}, true);
</script>
