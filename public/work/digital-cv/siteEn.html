<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Frameset//EN" "http://www.w3.org/TR/html4/frameset.dtd">
<html>
<head>
<meta charset="utf-8">
<title>siteEn</title>
<script src="fit-browser.js"></script>
<script>
function fitSite(designH) {
  var right = window.innerWidth * 0.78;
  var design = designH || 231;
  var topH = Math.ceil(design * (right / 980));
  var room = window.innerHeight - 220;
  if (room < 140) room = Math.floor(window.innerHeight * 0.42);
  if (topH > room) topH = room;
  var sets = document.getElementsByTagName("frameset");
  if (sets.length < 2) return;
  var wanted = topH + ",*";
  if (String(sets[1].rows).replace(/\s/g, "") === wanted) return;
  sets[1].rows = wanted;
}
window.onresize = fitSite;
</script>
</head>
<frameset cols="22%,*" framespacing="0" frameborder="0" onload="fitSite()">
  <frame name="checkEn" src="checkEn.html" scrolling="no">
  <frameset rows="240,*" framespacing="0" frameborder="0">
    <frame name="topFrameEn" src="topFrameEn.html" scrolling="no">
    <frame name="bottomFrameEn" src="bottomFrameEn.html" scrolling="auto">
  </frameset>
</frameset>
<noframes><body>This page uses frames. Open topFrameEn.html if your browser does not show them.</body></noframes>
</html>
