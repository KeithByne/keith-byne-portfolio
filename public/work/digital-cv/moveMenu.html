<script>


		function moveObject1 (objectID,up,down) {
		domStyle = findDOM(objectID,1);
		if (document.layers){
		if (domStyle.top != -118)
			{domStyle.top = -118;}
	   	else 	{domStyle.top = 0;}		
		}
		else
		if (domStyle.top != down)
			{domStyle.top = down;}
	   	else 	{domStyle.top = up;}	}
		

	</script>
