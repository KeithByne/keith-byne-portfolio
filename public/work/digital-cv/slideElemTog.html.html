<script>
function setSlide(objectID) {
	var domStyle = findDOM(objectID, 1);
	var y1 = parseInt(domStyle.top, 10);
	if (isNaN(y1)) y1 = 25;
	var dest = y1 > 80 ? 25 : 300;
	function step() {
		if (y1 < dest) y1 += 5;
		else if (y1 > dest) y1 -= 5;
		if (Math.abs(y1 - dest) < 5) y1 = dest;
		domStyle.top = y1 + "px";
		if (y1 !== dest) setTimeout(step, 16);
	}
	step();
}
</Script>

<style>
	.slideElement {
	position: absolute;
	font: bold 18px helvetica;
	background-color: #cfcfcf;
	border: 1px solid #003636;}
