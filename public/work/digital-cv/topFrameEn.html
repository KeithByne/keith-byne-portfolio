<script>
	
function moveObject (objectID,up,down) {
		domStyle = findDOM(objectID,1);
		if (document.layers){
		if (domStyle.top != -90)
			{domStyle.top = -90;}
	   	else 	{domStyle.top = 0;}		
		}
		else
		if (domStyle.top != down)
			{domStyle.top = down;}
	   	else 	{domStyle.top = up;}	}
		

</script>
