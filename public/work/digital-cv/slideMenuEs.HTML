<html>
<head>
<meta http-equiv="content-type" content="text/html;charset=iso-8859-1">
<title>SlideMenuEs</title>
<script src="findDOM.js"></script>

<script>
function setSlide(objectID,x2,y2) {
domStyle = findDOM(objectID,1);

var x1 = parseInt(domStyle.left);
var y1 = parseInt(domStyle.top);

if (y1 == y2) {y2 = -130;}

slider(x1,x2,y1,y2);

}

function slider(x1,x2,y1,y2) {


if (x1 != x2) {
	if (x1 < x2) {x1 +=10;}
	else {
	if (x1 > x2) {x1 -=10;}
	}
if (y1 != y2) {
	if (y1 < y2) {y1 +=10;}
	else {
	if (y1 > y2) {y1 -=10;}
	}}

if ((x1 !=  x2) || (y1 != y2)){

	if (document.getElementById){

	
	domStyle.top = parseInt(y1) + "px";}


	else if (document.layers){

	
	domStyle.top = y1;}

	
	
	setTimeout ('slider('+x1+','+x2+','+y1+','+y2+')',50);
}}}
</script>
<Style>
	 WIDTH: 125px;
	 COLOR: #cccccc; 
	 POSITION: absolute;
	 BACKGROUND-COLOR: #009999;
	 layer-background-color: #009999;
	}
</STYLE>
