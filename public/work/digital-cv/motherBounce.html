<script>


var x = 0, y = 0, w=160, h=100;//window position and size
var dx = 5, dy = 5;            //window velocity
var interval = 50;            //milliseconds between updates


//create the window to be moved
//the javascript: url a simple way to display a short document
//The final argument specities the window size.

var win = window.open('javascript:"<BR><H1>BOUNCE!</H1>"',"",
		 "width=" + w + ",height=" +h);

//set the initial position of the new window
win.moveTo(x,y);

//use setInterval() to call the bounce() method every interval
//milliseconds. Store the return value so that we can stop the 
//animation by passing it to clearInterval().

var intervalID = window.setInterval("bounce()",interval);


//this function moves the window by (dx,dy) every interval ms.
//It bounces every time the window reaches the edge of the screen
function bounce() {
	//if the user closes the window, stop the animation
	if (win.closed) {
		clearInterval (intervalID);
		return;		
		}

	//have we reached the left or right edge?
	if ((x+dx > (screen.availWidth - w)) || (x+dx < 0)) dx = -dx;
 
	//have we reached the top or bottom edge?
	if ((y+dy > (screen.availHeight - h)) || (y+dy < 0)) dy = -dy;

	//update the current position of the window

	x += dx;
	y += dy;

	//Finally move the window to the new position

	win.moveTo(x,y);

	}
</script>

</HEAD>
<BODY bgColor="#cfcfcf">
<!-- Clicking this button stops the animation -->
<div id="Layer1" style="position:absolute; width:386px; height:212px; z-index:1; left: 192px; top: 16px"> 
  <Div class="GParaHead">
    <p align="center">Generating New windows is increadibly common and very irritating. 
      But it can be fun to try to &quot;shoot&quot; the close button while the 
      window is on the move. That action in itself can make any number of things 
      happen. </p>
    <p align="center">If you get bored the &quot;stop&quot; button will do the 
      trick too.</p>
  </Div>
</div>

<FORM>
<INPUT TYPE="BUTTON" VALUE="STOP"
	onClick="clearInterval(intervalID); win.close();">
</FORM>

</BODY>
