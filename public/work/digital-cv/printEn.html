<html>
<head>
<title>Print Version of CV</title>
<meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1">
<style type="text/css">
  html, body {
    margin: 0;
    height: 100%;
    background-color: #cfcfcf;
    background-image: url("img/1999-background.png");
    background-repeat: no-repeat;
    background-position: right bottom;
    background-attachment: fixed;
    background-size: 800px 450px;
    overflow: hidden;
  }
  .sheet {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 12.5%;
    width: 75%;
    overflow: hidden;
    background: #cfcfcf;
  }
  .sheet iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
  }
</style>
</head>
<body bgcolor="#cfcfcf">
<div class="sheet">
  <iframe src="CVEn.pdf#toolbar=1&amp;navpanes=0&amp;scrollbar=1&amp;view=FitH" title="Print version of CV"></iframe>
</div>
</body>
</html>
