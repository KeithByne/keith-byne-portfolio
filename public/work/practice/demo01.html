<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demo 01 — styled</title>
  <link href="/fonts/open-sauce.css" rel="stylesheet" />
  <style>
    body { margin: 0; background: #d9d9d9; color: #3b3b3b; font: 15px/1.45 "Open Sauce One", sans-serif; }
    .sheet { width: min(880px, calc(100% - 2rem)); margin: 1.25rem auto; padding: 1.5rem 1.5rem 2rem; background: #fff; }
    #h5p-container { min-height: 280px; }
    html.is-frame body { background: #fff; overflow: hidden; }
    html.is-frame .sheet { width: 100%; margin: 0; }
    html.is-frame #h5p-container { min-height: 0; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/h5p-standalone@3.8.0/dist/main.bundle.js"></script>
  <script>
    if (window.parent !== window) document.documentElement.classList.add("is-frame");
  </script>
</head>
<body>
  <main class="sheet">
    <div id="h5p-container"></div>
  </main>
  <script>
    new H5PStandalone.H5P(document.getElementById("h5p-container"), {
      h5pJsonPath: "/work/practice/demo01",
      frameJs: "https://cdn.jsdelivr.net/npm/h5p-standalone@3.8.0/dist/frame.bundle.js",
      frameCss: "https://cdn.jsdelivr.net/npm/h5p-standalone@3.8.0/dist/styles/h5p.css"
    });

    function fitWords() {
      const inner = document.querySelector(".h5p-iframe");
      const doc = inner && inner.contentDocument;
      if (!doc) return false;
      const chips = [...doc.querySelectorAll(".h5p-drag-draggables-container [aria-grabbed]")];
      if (!chips.length) return false;
      if (!doc.querySelector(".h5p-drag-wide-screen, .h5p-drag-draggable-wide-screen")) return false;
      const bank = doc.querySelector(".h5p-drag-draggables-container");
      if (bank) bank.classList.remove("h5p-drag-wide-screen");
      for (const chip of chips) {
        if (chip.classList.contains("ui-draggable-dragging")) continue;
        chip.classList.remove("h5p-drag-draggable-wide-screen");
        chip.style.position = "relative";
        chip.style.left = "auto";
        chip.style.top = "auto";
        chip.style.width = "auto";
        chip.style.maxWidth = "none";
        chip.style.overflow = "visible";
        chip.style.whiteSpace = "nowrap";
        chip.style.display = "inline-block";
      }
      const sentences = doc.querySelector(".h5p-drag-droppable-words");
      if (sentences) sentences.style.marginRight = "0";
      const drag = doc.querySelector(".h5p-drag-text");
      if (drag) drag.style.overflow = "visible";
      return true;
    }

    if (window.parent !== window) {
      const sheet = document.querySelector(".sheet");
      let scheduled = false;
      const report = () => {
        if (scheduled) return;
        scheduled = true;
        requestAnimationFrame(() => {
          scheduled = false;
          fitWords();
          const height = Math.ceil(document.body.scrollHeight);
          if (height > 0) {
            parent.postMessage({ source: "lumi-demo", height }, location.origin);
          }
        });
      };
      new ResizeObserver(report).observe(sheet);
      const innerWatch = new ResizeObserver(report);
      const arm = () => {
        const inner = document.querySelector(".h5p-iframe");
        if (inner && !inner.dataset.fitWatch) {
          inner.dataset.fitWatch = "1";
          innerWatch.observe(inner);
        }
      };
      new MutationObserver(arm).observe(sheet, { childList: true, subtree: true });
      window.addEventListener("resize", report);
      report();
    }
  </script>
</body>
</html>
